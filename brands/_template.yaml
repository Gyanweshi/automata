# Brand Profile Template
# Copy this file to brands/{your-brand-slug}.yaml and fill it in.
# All fields are optional except slug and name.

slug: "your-brand-slug"
name: "Your Brand Display Name"
onboarded: "2026-01-01"

# --- Voice & Tone ---
# Each scale is 1–10. Archetyp options: authority | innovator | friend | rebel | guide
voice:
  formal_casual: 5        # 1=extremely formal, 10=extremely casual
  serious_playful: 5      # 1=extremely serious, 10=extremely playful
  technical_simple: 5     # 1=extremely technical, 10=extremely simple
  reserved_bold: 5        # 1=extremely reserved, 10=extremely bold
  archetype_primary: "friend"
  archetype_secondary: "guide"

# --- Vocabulary ---
vocabulary:
  use_words:
    - "empower"
    - "real"
    - "grow"
  avoid_words:
    - "synergy"
    - "leverage"
    - "guru"
  signature_phrases:
    - "Keep it real."

# --- Writing Rules ---
writing:
  dos:
    - "Use contractions freely"
    - "Address reader as 'you'"
    - "Lead with the benefit, not the feature"
  donts:
    - "Never use corporate jargon"
    - "Avoid passive voice in CTAs"
  # Hard cap on sentence length. 0 = no limit. Recommended: 15 for casual brands, 20 for professional.
  sentence_max_words: 15
  # Specific sentence patterns or constructions to never use.
  banned_constructions:
    - "Em dashes (—) of any kind"
    - "Sentences starting with 'It is worth noting' or 'It is important to'"
    - "Any use of: delve, leverage, seamlessly, game-changer, groundbreaking, innovative, cutting-edge"
    - "Subordinate clause chains requiring more than one comma per sentence"
    - "Passive voice constructions in hooks or CTAs"
  # 1-3 real approved captions that anchor the voice. The model will match these exactly.
  example_captions:
    - |
      [Paste a real caption you love here — ideally one that got good engagement]
    - |
      [A second example, different format — e.g. a story-based one vs a list-based one]

# --- Audience ---
audience:
  primary: "Describe your primary audience (age, role, platform)"
  secondary: "Optional secondary audience"
  pain_points:
    - "Pain point 1"
    - "Pain point 2"
  desires:
    - "What they want to achieve"

# --- Visual Identity ---
visual:
  colors:
    primary: "#000000"
    secondary: "#FFFFFF"
    accent: "#CCCCCC"
    background: "#FAFAFA"
  fonts:
    heading: "Font Name"
    body: "Font Name"
  photography_style: "Describe photo style (e.g., warm natural light, candid)"
  mood: "Describe overall visual mood"
  avoid_visuals:
    - "Stock photos with fake smiles"

# --- Platforms ---
platforms:
  instagram:
    handle: "@yourbrand"
    content_types:
      - "carousel"
      - "reel"
      - "story"
      - "static_post"
    posting_frequency: "5x/week"
    hashtag_groups:
      niche:
        - "#yourniche"
      broad:
        - "#broadtag"
      branded:
        - "#yourbrand"
  linkedin:
    handle: "company/your-brand"
    content_types:
      - "post"
      - "article"
      - "document_carousel"
    posting_frequency: "3x/week"
    hashtag_groups:
      niche: []
      broad: []
      branded: []

# --- Competitors ---
competitors:
  instagram:
    - "@competitor1"
    - "@competitor2"
  linkedin:
    - "company/competitor1"
  facebook:
    - "competitor.page"

# --- Content Pillars (must sum to 100) ---
content_pillars:
  educational: 35
  behind_the_scenes: 20
  social_proof: 15
  engagement: 20
  promotional: 10

# --- Deep Intelligence (Steps 1–5) ---
# These fields activate the extended research pipeline automatically.
# Leave any section empty to skip that step.

# Step 1: Community listening node
# Subreddits (no r/ prefix), YouTube channel IDs, X/Twitter list URLs
community:
  subreddits:
    - "yoursubreddit"
    - "relatedtopic"
  youtube_channels:
    - "UCxxxxxxxxxxxxxxxxxxxxxxxx"   # YouTube channel ID (from channel URL)
  x_lists: []                        # Full X/Twitter list URLs

# Step 2: Meta Ad Library audit
# Keywords to search. Requires META_AD_LIBRARY_TOKEN or APIFY_API_TOKEN.
meta_ads:
  keywords:
    - "your product category"
    - "competitor brand name"
  countries:
    - "US"
    - "GB"
    - "AU"

# Step 5: Cross-industry adjacency mapping
# Premium adjacent categories whose narrative/visual trends to scan.
# Steps 3 (visual DNA) and 4 (comment analysis) run automatically from scraped posts.
adjacent_industries:
  - "luxury hospitality"
  - "premium automotive"
  - "high-end consumer tech"
