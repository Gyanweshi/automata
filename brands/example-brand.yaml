slug: "example-brand"
name: "Example Brand Co."
onboarded: "2026-05-03"

voice:
  formal_casual: 7
  serious_playful: 6
  technical_simple: 8
  reserved_bold: 6
  archetype_primary: "friend"
  archetype_secondary: "guide"

vocabulary:
  use_words:
    - "empower"
    - "simple"
    - "real"
    - "grow"
    - "journey"
  avoid_words:
    - "synergy"
    - "leverage"
    - "disrupt"
    - "guru"
  signature_phrases:
    - "Keep it real."
    - "Your growth matters."

writing:
  dos:
    - "Use contractions freely"
    - "Address the reader as 'you'"
    - "Lead with the benefit, not the feature"
    - "Use short sentences — one idea per line"
  donts:
    - "Never use corporate jargon"
    - "Avoid passive voice in CTAs"
    - "No more than 3 hashtags inline (rest in first comment)"
  sentence_max_words: 15
  banned_constructions:
    - "Em dashes (—) of any kind"
    - "Any use of: seamlessly, game-changer, groundbreaking, leverage, delve"
    - "Opening a sentence with 'It is worth noting' or 'It is important to'"
    - "Passive voice in hooks or CTAs"
  example_captions:
    - |
      You don't need 10K followers to make money on Instagram.
      You need 100 people who trust you.
      Here's how to build that trust without posting every single day.
      Save this — you'll want it later.
    - |
      Real talk: I almost quit posting in January.
      Nothing was converting. Engagement was flat.
      Then I changed one thing.
      Drop a comment if you want to know what it was.

audience:
  primary: "Millennial women entrepreneurs, 28-40"
  secondary: "Gen Z aspiring business owners"
  pain_points:
    - "Overwhelmed by social media demands"
    - "Inconsistent posting leads to inconsistent growth"
    - "Unsure what content actually converts"
  desires:
    - "Authentic connection with their audience"
    - "Consistent growth without burnout"
    - "A clear, repeatable content strategy"

visual:
  colors:
    primary: "#E8A87C"
    secondary: "#41B3A3"
    accent: "#C38D9E"
    background: "#FEFEFE"
  fonts:
    heading: "Playfair Display"
    body: "Open Sans"
  photography_style: "warm, natural light, candid moments, minimal clutter"
  mood: "warm, inviting, authentic, aspirational but attainable"
  avoid_visuals:
    - "Stock photos with fake smiles"
    - "Overly polished or heavily filtered images"
    - "Dark or cold-toned photography"

platforms:
  instagram:
    handle: "@examplebrand"
    content_types:
      - "carousel"
      - "reel"
      - "story"
      - "static_post"
    posting_frequency: "5x/week"
    hashtag_groups:
      niche:
        - "#womenentrepreneurs"
        - "#femalefounder"
        - "#businesswomen"
      broad:
        - "#businesstips"
        - "#entrepreneurlife"
        - "#contentcreator"
      branded:
        - "#examplebrand"
  linkedin:
    handle: "company/example-brand"
    content_types:
      - "post"
      - "article"
      - "document_carousel"
    posting_frequency: "3x/week"
    hashtag_groups:
      niche:
        - "#womenleadership"
        - "#entrepreneurship"
      broad:
        - "#marketing"
        - "#smallbusiness"
      branded:
        - "#examplebrand"

competitors:
  instagram:
    - "@natashaoakley"
    - "@girlboss"
  linkedin:
    - "company/hubspot"
    - "company/buffer"
  facebook: []

content_pillars:
  educational: 35
  behind_the_scenes: 20
  social_proof: 15
  engagement: 20
  promotional: 10
