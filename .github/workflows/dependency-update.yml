name: Dependency update

# Quarterly (and on demand): compute safe updates, test them on Ubuntu and Windows, push them to a branch and open an
# issue with the report and a one-click "create pull request" link. Nothing reaches main without a person merging.
# Rules (scripts/deps_update.py): 14-day cool-down, no major versions, MCP servers smoke-tested, never downgrade.
on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *"   # 03:00 UTC on 1 Jan, 1 Apr, 1 Jul, 1 Oct
  workflow_dispatch:
    inputs:
      cooldown_days:
        description: "Only versions published at least this many days ago"
        default: "14"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install "uv>=0.11"
      - name: Install Node packages as locked
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix agents/automata_core/ig-research
      - name: Compute safe updates
        run: python scripts/deps.py update --cooldown-days "${{ inputs.cooldown_days || '14' }}" --report "$RUNNER_TEMP/report.md"
      - name: Collect changed files
        id: diff
        run: |
          mkdir -p "$RUNNER_TEMP/changes"
          git diff --name-only > "$RUNNER_TEMP/changes/FILES"
          if [ -s "$RUNNER_TEMP/changes/FILES" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            while read -r f; do mkdir -p "$RUNNER_TEMP/changes/files/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/changes/files/$f"; done < "$RUNNER_TEMP/changes/FILES"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          cp "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/changes/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-update
          path: ${{ runner.temp }}/changes

  test:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dependency-update
          path: ${{ runner.temp }}/changes
      - name: Apply the updated files
        shell: bash
        run: cp -r "$RUNNER_TEMP/changes/files/." .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install from the updated lockfile
        shell: bash
        run: |
          python -m pip install "uv>=0.11"
          uv export --frozen --no-hashes --no-emit-project --no-header | grep -v '^-e \|^\./' > "$RUNNER_TEMP/locked.txt"
          python -m pip install -r "$RUNNER_TEMP/locked.txt"
          python -m pip install --no-deps -e ./packages/agency-common -e ./packages/agency-research -e ./packages/agency-storyboard -e ./packages/agency-content
          python -m pip install "pip-audit>=2.10"
      - name: Checks
        shell: bash
        run: |
          python scripts/check-cross-platform.py
          python scripts/deps.py check --pins-only
          python scripts/deps.py docs --check
          python scripts/deps.py verify-downloads
          python scripts/run-agent.py --help > /dev/null
      - name: Tests
        run: python -m pytest -q packages/agency-common/tests packages/agency-research/tests
      - name: Security audit of the updated lockfile
        shell: bash
        run: >-
          python -m pip_audit -r "$RUNNER_TEMP/locked.txt" --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  publish:
    needs: [update, test]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the update branch
      issues: write     # open the report issue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dependency-update
          path: ${{ runner.temp }}/changes
      - name: Push the update branch and open the report issue
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.test.result }}
        run: |
          branch="deps/update-$(date -u +%Y-%m-%d)"
          cp -r "$RUNNER_TEMP/changes/files/." .
          git config user.name "automata-deps-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(deps): quarterly dependency update $(date -u +%Y-%m-%d)"
          git push -f origin "$branch"
          if [ "$TESTS" = "success" ]; then verdict="Tests passed on Ubuntu and Windows, security audit clean."; else verdict="**Tests did not pass ($TESTS)**: see the workflow run before merging."; fi
          {
            echo "$verdict"
            echo
            echo "**Review and merge:** https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat "$RUNNER_TEMP/changes/report.md"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "Dependency update $(date -u +%Y-%m-%d): ready for review" --body-file "$RUNNER_TEMP/body.md"
