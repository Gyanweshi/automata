name: Security and quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0"
          python -m pip install -r requirements.txt
          python -m pip install "pip-audit>=2.10" "bandit[toml]>=1.9" "detect-secrets>=1.5"
      - name: Audit Python dependencies
        run: python -m pip_audit
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run high-severity Bandit gate
        run: >-
          python -m bandit -q -r
          packages/agency-common/src
          packages/agency-research/src
          packages/agency-storyboard/src
          packages/agency-content/src
          packages/freepik-fastmcp/src
          core scripts agents/automata_core agents/openedswarm_core
          -lll
      - name: Scan tracked files for verified secrets
        run: python -m detect_secrets scan --only-verified
      - name: Run tests
        run: python -m pytest -q packages/agency-common/tests packages/agency-research/tests

  npm-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory:
          - .
          - agents/automata_core/ig-research
          - agents/openedswarm_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --omit=dev
