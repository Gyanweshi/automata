<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LHWRF Design System — Styleguide</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html, body { background:#f6f7f4; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .petal { border-radius: 0.25rem 3rem 0.25rem 0.25rem; }
  .grain-line { background-image: linear-gradient(90deg, rgba(3,57,67,.08) 0 1px, transparent 1px 100%); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect } = React;

/* ---------------- Atoms ---------------- */

function Eyebrow({ children, tone = "teal" }) {
  const c = tone === "lime" ? "text-[#e7ff00]" : tone === "white" ? "text-white/70" : "text-[#1b6b59]";
  return (
    <div className={`text-xs font-medium uppercase tracking-[0.18em] ${c}`}>
      {children}
    </div>
  );
}

function SectionHeader({ eyebrow, title, blurb }) {
  return (
    <div className="mb-10">
      <Eyebrow>{eyebrow}</Eyebrow>
      <h2 className="mt-3 text-3xl md:text-4xl font-bold tracking-tight text-[#0e1a1f]">{title}</h2>
      {blurb ? <p className="mt-3 max-w-2xl text-[#6b7a7e] leading-relaxed">{blurb}</p> : null}
    </div>
  );
}

function Card({ children, className = "" }) {
  return (
    <div className={`bg-white border border-[#0339430f] rounded-md ${className}`}
         style={{ boxShadow: "0 1px 2px rgba(3,57,67,.06), 0 12px 32px -12px rgba(3,57,67,.18)" }}>
      {children}
    </div>
  );
}

function Btn({ variant = "primary", children, icon }) {
  const base = "inline-flex items-center gap-2 px-5 py-3 rounded text-sm font-medium transition-colors";
  const v = {
    primary:   "bg-[#069c3c] text-white hover:bg-[#08a240]",
    secondary: "bg-transparent text-[#0e1a1f] border border-[#0e1a1f] hover:bg-[#0e1a1f] hover:text-white",
    accent:    "bg-[#e7ff00] text-[#033943] font-bold hover:bg-[#d6ee00]",
    ghost:     "bg-transparent text-[#069c3c] hover:bg-[#069c3c]/10",
  }[variant];
  return (
    <button className={`${base} ${v}`}>
      {children}
      {icon ? <i data-lucide={icon} className="w-4 h-4"></i> : null}
    </button>
  );
}

/* ---------------- Sections ---------------- */

function Hero() {
  return (
    <section className="bg-[#033943] text-white">
      <div className="max-w-6xl mx-auto px-8 py-16 md:py-24 grid md:grid-cols-12 gap-10 items-center">
        <div className="md:col-span-7">
          <Eyebrow tone="lime">Design system · v0.1</Eyebrow>
          <h1 className="mt-4 text-5xl md:text-6xl font-extrabold tracking-tight leading-[1.05]">
            A grounded, optimistic <br/>
            visual language.
          </h1>
          <p className="mt-6 text-lg text-white/70 max-w-xl leading-relaxed">
            Tokens, components and patterns for the Lupin Human Welfare &amp; Research Foundation.
            Built for the website, impact reports, and field-team material.
          </p>
          <div className="mt-8 flex flex-wrap gap-3">
            <Btn variant="primary" icon="arrow-right">Browse components</Btn>
            <Btn variant="accent">Get the tokens</Btn>
          </div>
        </div>
        <div className="md:col-span-5">
          {/* Petal-shaped image placeholder */}
          <div className="relative aspect-[4/5] bg-gradient-to-br from-[#069c3c] to-[#1b6b59] rounded-tr-[3rem] rounded-bl rounded-br rounded-tl overflow-hidden">
            <div className="absolute inset-0 flex items-center justify-center text-white/30 text-sm">
              hero image · petal mask
            </div>
            <div className="absolute -right-6 -top-6 w-28 h-28 bg-[#e7ff00] rounded-tr-[3rem] rounded-bl rounded-br rounded-tl"></div>
          </div>
        </div>
      </div>
    </section>
  );
}

function ColorsSection() {
  const swatches = [
    { name: "Primary Green",  hex: "#069c3c", role: "CTAs, links, hero accents",   text: "white" },
    { name: "Dark Green",     hex: "#08a240", role: "Hover / press for primary",   text: "white" },
    { name: "Deep Teal",      hex: "#1b6b59", role: "Secondary surfaces, eyebrow", text: "white" },
    { name: "Lime Accent",    hex: "#e7ff00", role: "One-moment highlight",        text: "navy"  },
    { name: "Navy",           hex: "#033943", role: "Dark grounds, footer",        text: "white" },
  ];
  const neutrals = [
    { name: "Paper",  hex: "#f6f7f4", role: "Page background", text: "navy"  },
    { name: "Ink",    hex: "#0e1a1f", role: "Body on light",   text: "white" },
    { name: "Mute",   hex: "#6b7a7e", role: "Secondary text",  text: "white" },
  ];

  return (
    <section className="max-w-6xl mx-auto px-8 py-20">
      <SectionHeader
        eyebrow="01 · Colors"
        title="A green spectrum, grounded in navy."
        blurb="The brand pivots on a confident green primary against a deep navy ground. Lime is the one moment of energy — used once per screen, never as area fill."
      />
      <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
        {swatches.map(s => (
          <div key={s.hex} className="flex flex-col">
            <div className="aspect-[5/6] rounded-tr-[3rem] rounded-bl rounded-br rounded-tl flex items-end p-5"
                 style={{ background: s.hex }}>
              <div className={s.text === "white" ? "text-white" : "text-[#033943]"}>
                <div className="font-bold text-base leading-tight">{s.name}</div>
                <div className="text-xs opacity-80 mt-1 font-mono">{s.hex.toUpperCase()}</div>
              </div>
            </div>
            <div className="text-xs text-[#6b7a7e] mt-3 leading-relaxed">{s.role}</div>
          </div>
        ))}
      </div>

      <div className="mt-10 grid grid-cols-3 gap-4">
        {neutrals.map(s => (
          <div key={s.hex} className="border border-[#0339431a] rounded p-5"
               style={{ background: s.hex, color: s.text === "white" ? "#fff" : "#033943" }}>
            <div className="font-bold">{s.name}</div>
            <div className="text-xs opacity-70 font-mono mt-1">{s.hex.toUpperCase()}</div>
            <div className="text-xs opacity-70 mt-3">{s.role}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function TypographySection() {
  return (
    <section className="bg-white border-y border-[#0339430f]">
      <div className="max-w-6xl mx-auto px-8 py-20">
        <SectionHeader
          eyebrow="02 · Typography"
          title="System sans, set tight."
          blurb="Standard font-sans with bold weights for headings. Tight tracking on display sizes; relaxed leading on body for readability of long-form copy."
        />
        <div className="grid md:grid-cols-12 gap-10">
          <div className="md:col-span-3 text-sm text-[#6b7a7e] space-y-1">
            <div>font-sans</div>
            <div>800 / 700 / 500 / 400</div>
            <div>tracking -0.02em</div>
            <div>leading 1.05 → 1.6</div>
          </div>
          <div className="md:col-span-9 space-y-8">
            <div>
              <Eyebrow>H1 · 60 / 800 / -0.02em</Eyebrow>
              <div className="mt-2 text-6xl font-extrabold tracking-tight leading-[1.05] text-[#0e1a1f]">
                Stronger livelihoods for one and a half million rural families.
              </div>
            </div>
            <div>
              <Eyebrow>H2 · 36 / 700</Eyebrow>
              <div className="mt-2 text-4xl font-bold tracking-tight text-[#0e1a1f]">
                We work alongside farmers, women's collectives, and panchayats across 16 states.
              </div>
            </div>
            <div>
              <Eyebrow>H3 · 24 / 700</Eyebrow>
              <div className="mt-2 text-2xl font-bold text-[#0e1a1f]">
                Agriculture, livelihoods, women's empowerment, education.
              </div>
            </div>
            <div>
              <Eyebrow>Body · 16 / 400 / 1.6</Eyebrow>
              <p className="mt-2 text-base leading-relaxed text-[#0e1a1f] max-w-2xl">
                We partner with rural communities to build long-term livelihoods. Our work spans
                watershed development, sustainable agriculture, women-led enterprise, and access
                to schooling and primary healthcare. Read the 2024 impact report for full numbers.
              </p>
            </div>
            <div>
              <Eyebrow>Eyebrow · 12 / 500 / 0.18em</Eyebrow>
              <div className="mt-2"><Eyebrow>Field programs</Eyebrow></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function ButtonsSection() {
  return (
    <section className="max-w-6xl mx-auto px-8 py-20">
      <SectionHeader
        eyebrow="03 · Buttons"
        title="Three roles, no more."
        blurb="Primary green for the main action. Secondary outlined for adjacent actions. Lime accent for one moment of visual energy per surface."
      />
      <div className="grid md:grid-cols-3 gap-6">
        {[
          { label: "Primary",   v: "primary",   note: "Main CTA. One per surface, ideally one per fold." },
          { label: "Secondary", v: "secondary", note: "Adjacent action — outlined, ink stroke." },
          { label: "Accent",    v: "accent",    note: "Lime. Use sparingly — single-moment highlight." },
        ].map(b => (
          <Card key={b.v} className="p-8">
            <Eyebrow>{b.label}</Eyebrow>
            <div className="mt-6 flex flex-wrap gap-3 items-center">
              <Btn variant={b.v}>Read report</Btn>
              <Btn variant={b.v} icon="arrow-right">Learn more</Btn>
            </div>
            <p className="mt-6 text-sm text-[#6b7a7e] leading-relaxed">{b.note}</p>
          </Card>
        ))}
      </div>

      <div className="mt-6 grid md:grid-cols-3 gap-6">
        <Card className="p-6">
          <Eyebrow>Hover</Eyebrow>
          <div className="mt-4"><Btn variant="primary">→ darkens to #08a240</Btn></div>
        </Card>
        <Card className="p-6">
          <Eyebrow>Disabled</Eyebrow>
          <div className="mt-4">
            <button className="inline-flex items-center gap-2 px-5 py-3 rounded text-sm font-medium bg-[#069c3c]/40 text-white cursor-not-allowed">
              Read report
            </button>
          </div>
        </Card>
        <Card className="p-6">
          <Eyebrow>Ghost link</Eyebrow>
          <div className="mt-4">
            <a className="inline-flex items-center gap-1 text-[#069c3c] font-medium hover:underline">
              Read the report <i data-lucide="arrow-up-right" className="w-4 h-4"></i>
            </a>
          </div>
        </Card>
      </div>
    </section>
  );
}

function ProductCard({ tag, title, body }) {
  return (
    <Card className="overflow-hidden">
      {/* Petal image area */}
      <div className="relative aspect-[4/3] bg-gradient-to-br from-[#069c3c] to-[#1b6b59] rounded-tr-[3rem]">
        <div className="absolute inset-0 flex items-center justify-center text-white/30 text-xs">
          program photo
        </div>
        <div className="absolute top-4 left-4 inline-flex items-center gap-2 bg-white/95 px-3 py-1 rounded text-[11px] font-medium uppercase tracking-[0.16em] text-[#1b6b59]">
          {tag}
        </div>
      </div>
      <div className="p-8">
        <h3 className="text-xl font-bold text-[#0e1a1f] tracking-tight">{title}</h3>
        <p className="mt-3 text-sm text-[#6b7a7e] leading-relaxed">{body}</p>
        <a className="mt-6 inline-flex items-center gap-1 text-[#069c3c] font-medium text-sm hover:gap-2 transition-all">
          Learn more <i data-lucide="arrow-right" className="w-4 h-4"></i>
        </a>
      </div>
    </Card>
  );
}

function ComponentSection() {
  return (
    <section className="bg-[#ecede8]/60 border-y border-[#0339430f]">
      <div className="max-w-6xl mx-auto px-8 py-20">
        <SectionHeader
          eyebrow="04 · UI components"
          title="Program card."
          blurb="The flagship pattern. Petal radius on the image, p-8 padding inside, ink title, mute body, green CTA link."
        />
        <div className="grid md:grid-cols-3 gap-6">
          <ProductCard
            tag="Agriculture"
            title="Watershed development across 4,500 villages."
            body="Soil and water conservation programs that have restored 1.8M hectares of farmland and lifted yields for smallholder farmers."
          />
          <ProductCard
            tag="Livelihoods"
            title="Women-led self-help groups."
            body="Training, microfinance and market linkages for over 60,000 women's collectives operating dairy, tailoring, and food-processing enterprises."
          />
          <ProductCard
            tag="Education"
            title="Anganwadi and primary schools."
            body="Early-childhood centers, teacher training and school-readiness programs serving more than 200,000 children annually."
          />
        </div>
      </div>
    </section>
  );
}

function PetalMotifSection() {
  return (
    <section className="max-w-6xl mx-auto px-8 py-20">
      <SectionHeader
        eyebrow="05 · The petal motif"
        title="One asymmetric corner."
        blurb="Border-top-right radius of 3rem, all other corners square or near-square. Reserved for image masks and card-shaped surfaces. Never on buttons, inputs or dialogs."
      />
      <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
        {[
          { bg: "#069c3c", lbl: "Primary"   },
          { bg: "#1b6b59", lbl: "Teal"      },
          { bg: "#033943", lbl: "Navy"      },
          { bg: "#e7ff00", lbl: "Lime", dark: true },
        ].map(t => (
          <div key={t.lbl} className="aspect-square rounded-tr-[3rem] rounded-bl rounded-br rounded-tl flex items-end p-5"
               style={{ background: t.bg }}>
            <div className={`text-sm font-bold ${t.dark ? "text-[#033943]" : "text-white"}`}>{t.lbl}</div>
          </div>
        ))}
      </div>
      <pre className="mt-8 p-6 bg-[#033943] text-white/90 text-sm rounded font-mono overflow-auto leading-relaxed">
{`.petal {
  border-radius: 0.25rem 3rem 0.25rem 0.25rem;
  /*  TL          TR    BR          BL  */
}

/* Tailwind */
className="rounded-tr-[3rem] rounded-bl rounded-br rounded-tl"`}
      </pre>
    </section>
  );
}

function Footer() {
  return (
    <footer className="bg-[#033943] text-white/80">
      <div className="max-w-6xl mx-auto px-8 py-12 grid md:grid-cols-3 gap-10">
        <div>
          <div className="flex items-center gap-3">
            <div className="bg-white rounded p-2 inline-flex"><img src="assets/lupin-foundation-logo.png" alt="LHWRF" className="h-8 w-auto"/></div>
          </div>
          <p className="mt-4 text-sm text-white/60 max-w-xs leading-relaxed">
            Lupin Human Welfare &amp; Research Foundation — social impact and rural development.
          </p>
        </div>
        <div>
          <Eyebrow tone="white">Tokens</Eyebrow>
          <ul className="mt-4 space-y-2 text-sm">
            <li>colors_and_type.css</li>
            <li>preview/ specimens</li>
            <li>assets/</li>
          </ul>
        </div>
        <div>
          <Eyebrow tone="white">Surfaces</Eyebrow>
          <ul className="mt-4 space-y-2 text-sm">
            <li>ui_kits/marketing/</li>
            <li>SKILL.md</li>
            <li>README.md</li>
          </ul>
        </div>
      </div>
      <div className="border-t border-white/10">
        <div className="max-w-6xl mx-auto px-8 py-6 text-xs text-white/40 flex flex-wrap justify-between gap-4">
          <div>v0.1 · LHWRF design system</div>
          <div>Substitutions flagged: font, icons, knock-out logo.</div>
        </div>
      </div>
    </footer>
  );
}

/* ---------------- App ---------------- */

function App() {
  useEffect(() => {
    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();
  });
  return (
    <div className="min-h-screen bg-[#f6f7f4] text-[#0e1a1f]">
      <Hero/>
      <ColorsSection/>
      <TypographySection/>
      <ButtonsSection/>
      <ComponentSection/>
      <PetalMotifSection/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
