<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LHWRF Marketing — UI Kit</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7f4; color:#0e1a1f; }
  .petal { border-radius: .25rem 3rem .25rem .25rem; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useState } = React;

const Eyebrow = ({ children, tone="teal" }) => (
  <div className={`text-xs font-medium uppercase tracking-[0.18em] ${
    tone==="lime" ? "text-[#e7ff00]" : tone==="white" ? "text-white/70" : "text-[#1b6b59]"
  }`}>{children}</div>
);

function Header({ onSearch }) {
  return (
    <header className="sticky top-0 z-30 backdrop-blur bg-[#f6f7f4]/85 border-b border-[#0339430f]">
      <div className="max-w-6xl mx-auto px-8 h-20 flex items-center justify-between">
        <a className="flex items-center">
          <img src="../../assets/lupin-foundation-logo.png" alt="LHWRF" className="h-10 w-auto"/>
        </a>
        <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-[#0e1a1f]/80">
          <a className="hover:text-[#069c3c]">Programs</a>
          <a className="hover:text-[#069c3c]">Impact</a>
          <a className="hover:text-[#069c3c]">Stories</a>
          <a className="hover:text-[#069c3c]">About</a>
          <a className="hover:text-[#069c3c]">News</a>
        </nav>
        <button onClick={onSearch}
          className="inline-flex items-center gap-2 px-4 py-2 rounded text-sm font-medium bg-[#069c3c] text-white hover:bg-[#08a240]">
          <i data-lucide="heart-handshake" className="w-4 h-4"></i> Get involved
        </button>
      </div>
    </header>
  );
}

function Hero() {
  return (
    <section className="relative">
      <div className="max-w-6xl mx-auto px-8 py-20 grid md:grid-cols-12 gap-10 items-center">
        <div className="md:col-span-7">
          <Eyebrow>Rural development · Since 1988</Eyebrow>
          <h1 className="mt-4 text-5xl md:text-6xl font-extrabold tracking-tight leading-[1.05] text-[#0e1a1f]">
            Stronger livelihoods for
            <span className="relative inline-block ml-2">
              <span className="relative z-10">rural India.</span>
              <span className="absolute inset-x-0 bottom-1 h-3 bg-[#e7ff00] -z-0"></span>
            </span>
          </h1>
          <p className="mt-6 text-lg text-[#6b7a7e] max-w-xl leading-relaxed">
            We work alongside farmers, women's collectives, and panchayats across
            4,500+ villages — in agriculture, livelihoods, women's empowerment,
            education, and rural health.
          </p>
          <div className="mt-8 flex flex-wrap gap-3">
            <button className="inline-flex items-center gap-2 px-5 py-3 rounded text-sm font-medium bg-[#069c3c] text-white hover:bg-[#08a240]">
              Explore our programs <i data-lucide="arrow-right" className="w-4 h-4"></i>
            </button>
            <button className="inline-flex items-center gap-2 px-5 py-3 rounded text-sm font-medium border border-[#0e1a1f] hover:bg-[#0e1a1f] hover:text-white transition-colors">
              Read 2024 impact report
            </button>
          </div>
        </div>
        <div className="md:col-span-5 relative">
          <div className="relative aspect-[4/5] bg-gradient-to-br from-[#069c3c] to-[#1b6b59] petal overflow-hidden">
            <div className="absolute inset-0 flex items-center justify-center text-white/30 text-sm">field photography</div>
          </div>
          <div className="absolute -left-6 -bottom-6 bg-[#e7ff00] petal p-5 max-w-[200px] hidden md:block">
            <div className="text-xs font-bold tracking-[0.16em] uppercase text-[#033943]">Since 1988</div>
            <div className="mt-1 text-sm text-[#033943] font-medium leading-snug">1.5M+ lives across 16 states.</div>
          </div>
        </div>
      </div>
    </section>
  );
}

function StatStrip() {
  const stats = [
    { n: "4,500+", l: "villages reached" },
    { n: "1.5M+",  l: "lives touched" },
    { n: "16",     l: "states active" },
    { n: "60K+",   l: "women's collectives" },
  ];
  return (
    <section className="bg-[#033943] text-white">
      <div className="max-w-6xl mx-auto px-8 py-16 grid grid-cols-2 md:grid-cols-4 gap-10">
        {stats.map(s => (
          <div key={s.l}>
            <div className="text-4xl md:text-5xl font-extrabold tracking-tight">{s.n}</div>
            <div className="mt-2 text-sm text-white/60 leading-relaxed">{s.l}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function TherapyCard({ tag, title, body, expanded, onToggle }) {
  return (
    <button onClick={onToggle}
      className="text-left bg-white border border-[#0339430f] overflow-hidden hover:-translate-y-0.5 transition-transform"
      style={{ boxShadow: "0 1px 2px rgba(3,57,67,.06), 0 12px 32px -12px rgba(3,57,67,.18)" }}>
      <div className="relative aspect-[4/3] bg-gradient-to-br from-[#069c3c] to-[#1b6b59] rounded-tr-[3rem]">
        <div className="absolute top-4 left-4 inline-flex items-center bg-white/95 px-3 py-1 rounded text-[11px] font-medium uppercase tracking-[0.16em] text-[#1b6b59]">
          {tag}
        </div>
      </div>
      <div className="p-8">
        <h3 className="text-xl font-bold tracking-tight">{title}</h3>
        {expanded && (
          <p className="mt-3 text-sm text-[#6b7a7e] leading-relaxed">{body}</p>
        )}
        <span className="mt-6 inline-flex items-center gap-1 text-[#069c3c] font-medium text-sm">
          {expanded ? "Hide details" : "Learn more"} <i data-lucide={expanded?"chevron-up":"arrow-right"} className="w-4 h-4"></i>
        </span>
      </div>
    </button>
  );
}

function TherapyAreas() {
  const [open, setOpen] = useState(null);
  const items = [
    { tag:"Agriculture",   title:"Watershed development across 4,500 villages.", body:"Soil and water conservation that has restored 1.8M hectares of farmland and lifted yields for smallholder farmers." },
    { tag:"Livelihoods",   title:"Women-led self-help groups.",                  body:"Training, microfinance and market linkages for over 60,000 women's collectives operating dairy, tailoring, and food-processing enterprises." },
    { tag:"Education",     title:"Anganwadi and primary schools.",                body:"Early-childhood centers, teacher training and school-readiness programs serving more than 200,000 children annually." },
    { tag:"Health",        title:"Mobile clinics for last-mile care.",            body:"Primary care, maternal-health camps, and adolescent-health programming reaching remote habitations on a fixed monthly schedule." },
    { tag:"Skills",        title:"Youth vocational training.",                    body:"Industry-linked training in trades, retail, healthcare and digital skills, with placement support for first-time job-seekers." },
    { tag:"Empowerment",   title:"Community-led panchayats.",                     body:"Capacity-building for elected village representatives — budgeting, planning and rights-based program delivery." },
  ];
  return (
    <section className="max-w-6xl mx-auto px-8 py-20">
      <div className="flex items-end justify-between mb-10">
        <div>
          <Eyebrow>Programs</Eyebrow>
          <h2 className="mt-3 text-3xl md:text-4xl font-bold tracking-tight">Six focus areas, one mission.</h2>
        </div>
        <a className="hidden md:inline-flex items-center gap-1 text-[#069c3c] font-medium text-sm">View all <i data-lucide="arrow-right" className="w-4 h-4"></i></a>
      </div>
      <div className="grid md:grid-cols-3 gap-6">
        {items.map((it, i) => (
          <TherapyCard key={i} {...it} expanded={open===i} onToggle={() => setOpen(open===i?null:i)} />
        ))}
      </div>
    </section>
  );
}

function CalloutBand() {
  return (
    <section className="bg-[#033943] text-white">
      <div className="max-w-6xl mx-auto px-8 py-20 grid md:grid-cols-12 gap-10 items-center">
        <div className="md:col-span-8">
          <Eyebrow tone="lime">Get involved</Eyebrow>
          <h2 className="mt-3 text-3xl md:text-4xl font-bold tracking-tight">
            Partner with us — fund a program, volunteer, or share your skills.
          </h2>
          <p className="mt-4 text-white/70 max-w-2xl leading-relaxed">
            We work with corporate partners, foundations, and individual donors to
            scale livelihoods programs in the communities that need them most.
          </p>
        </div>
        <div className="md:col-span-4 md:text-right">
          <button className="inline-flex items-center gap-2 px-6 py-4 rounded text-sm font-bold bg-[#e7ff00] text-[#033943] hover:bg-[#d6ee00]">
            Become a partner <i data-lucide="arrow-right" className="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  const cols = [
    { h: "Programs",      l: ["Agriculture","Livelihoods","Education","Health","Empowerment"] },
    { h: "About",         l: ["Our story","Leadership","Governance","Annual reports","Newsroom"] },
    { h: "Get involved",  l: ["Partner with us","Donate","Volunteer","Careers"] },
    { h: "Resources",     l: ["Impact reports","Field stories","Press kit","Contact"] },
  ];
  return (
    <footer className="bg-[#033943] text-white/80 border-t border-white/10">
      <div className="max-w-6xl mx-auto px-8 py-16 grid md:grid-cols-5 gap-10">
        <div>
          <div className="bg-white rounded p-3 inline-flex">
            <img src="../../assets/lupin-foundation-logo.png" alt="LHWRF" className="h-10 w-auto"/>
          </div>
          <p className="mt-4 text-sm text-white/60 max-w-xs leading-relaxed">
            Lupin Human Welfare &amp; Research Foundation. Stronger livelihoods for rural India.
          </p>
        </div>
        {cols.map(c => (
          <div key={c.h}>
            <Eyebrow tone="white">{c.h}</Eyebrow>
            <ul className="mt-4 space-y-2 text-sm">
              {c.l.map(x => <li key={x} className="hover:text-white">{x}</li>)}
            </ul>
          </div>
        ))}
      </div>
      <div className="border-t border-white/10">
        <div className="max-w-6xl mx-auto px-8 py-6 text-xs text-white/40 flex flex-wrap justify-between gap-4">
          <div>© LHWRF · UI kit — design system reference.</div>
          <div className="flex gap-5"><a>Privacy</a><a>Terms</a><a>Contact</a></div>
        </div>
      </div>
    </footer>
  );
}

function SearchOverlay({ open, onClose }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 bg-[#033943]/70 backdrop-blur flex items-start justify-center p-8" onClick={onClose}>
      <div className="bg-white w-full max-w-2xl rounded p-8 mt-20" onClick={e=>e.stopPropagation()}
           style={{ boxShadow: "0 1px 2px rgba(3,57,67,.06), 0 30px 80px -20px rgba(3,57,67,.4)" }}>
        <Eyebrow>Get involved</Eyebrow>
        <div className="mt-3 flex items-center gap-3 border-b border-[#0339431a] pb-3">
          <i data-lucide="search" className="w-5 h-5 text-[#6b7a7e]"></i>
          <input autoFocus placeholder="Search programs, stories, reports…" className="flex-1 outline-none text-lg" />
          <button onClick={onClose} className="text-sm text-[#6b7a7e] hover:text-[#0e1a1f]">Esc</button>
        </div>
        <div className="mt-6">
          <div className="text-xs text-[#6b7a7e] mb-3">Suggested</div>
          <ul className="space-y-2 text-sm">
            {["Watershed development", "Women's self-help groups", "Anganwadi program", "Mobile health clinics"].map(x => (
              <li key={x} className="flex items-center justify-between hover:bg-[#f6f7f4] px-3 py-2 -mx-3 rounded">
                <span>{x}</span><i data-lucide="arrow-right" className="w-4 h-4 text-[#069c3c]"></i>
              </li>
            ))}
          </ul>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [searchOpen, setSearchOpen] = useState(false);
  useEffect(() => {
    if (window.lucide) window.lucide.createIcons();
  });
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") setSearchOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <div>
      <Header onSearch={() => setSearchOpen(true)} />
      <Hero/>
      <StatStrip/>
      <TherapyAreas/>
      <CalloutBand/>
      <Footer/>
      <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
