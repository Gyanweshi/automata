<!doctype html><html><head><meta charset="utf-8"/>
<style>
  body{margin:0;background:#f6f7f4;font-family:ui-sans-serif,system-ui,sans-serif;padding:20px}
  .row{display:flex;gap:12px}
  .sw{flex:1;aspect-ratio:1/1;border-radius:.25rem 3rem .25rem .25rem;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-weight:700;font-size:13px;line-height:1.2}
  .hex{font-weight:500;font-size:11px;font-family:ui-monospace,monospace;opacity:.85;margin-top:4px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#069c3c">Primary<div class="hex">#069C3C</div></div>
  <div class="sw" style="background:#08a240">Dark<div class="hex">#08A240</div></div>
  <div class="sw" style="background:#1b6b59">Teal<div class="hex">#1B6B59</div></div>
  <div class="sw" style="background:#e7ff00;color:#033943">Lime<div class="hex" style="color:#033943">#E7FF00</div></div>
  <div class="sw" style="background:#033943">Navy<div class="hex">#033943</div></div>
</div>
</body></html>
