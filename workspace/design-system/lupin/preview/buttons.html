<!doctype html><html><head><meta charset="utf-8"/>
<style>
  body{margin:0;background:#f6f7f4;font-family:ui-sans-serif,system-ui,sans-serif;padding:28px;color:#0e1a1f;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:4px;font-weight:500;font-size:14px;border:1px solid transparent;cursor:pointer}
  .primary{background:#069c3c;color:#fff}
  .secondary{background:transparent;color:#0e1a1f;border-color:#0e1a1f}
  .accent{background:#e7ff00;color:#033943;font-weight:700}
  .ghost{background:transparent;color:#069c3c}
  svg{width:14px;height:14px}
</style></head><body>
<button class="btn primary">Find a product <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
<button class="btn secondary">Learn more</button>
<button class="btn accent">Contact us</button>
<button class="btn ghost">Read report →</button>
</body></html>
