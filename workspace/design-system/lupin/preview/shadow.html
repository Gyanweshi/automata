<!doctype html><html><head><meta charset="utf-8"/>
<style>
  body{margin:0;background:#f6f7f4;font-family:ui-sans-serif,system-ui,sans-serif;padding:24px;display:flex;gap:24px;align-items:center}
  .card{background:#fff;width:160px;height:120px;display:flex;align-items:center;justify-content:center;color:#1b6b59;font-weight:600;font-size:13px;border:1px solid rgba(3,57,67,.1)}
  .a{border-radius:6px;box-shadow:0 1px 2px rgba(3,57,67,.06),0 12px 32px -12px rgba(3,57,67,.18)}
  .b{border-radius:6px}
  .meta{font-size:11px;color:#6b7a7e;font-family:ui-monospace,monospace;line-height:1.6}
</style></head><body>
<div class="card a">elevated card</div>
<div class="card b">flat card</div>
<div class="meta">
  --shadow-card:<br>
  &nbsp;0 1px 2px rgba(3,57,67,.06),<br>
  &nbsp;0 12px 32px -12px rgba(3,57,67,.18)<br>
  <span style="opacity:.6">one shadow only · no glow · no neumorphism</span>
</div>
</body></html>
