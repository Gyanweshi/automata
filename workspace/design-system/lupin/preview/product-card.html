<!doctype html><html><head><meta charset="utf-8"/>
<style>
  body{margin:0;background:#f6f7f4;font-family:ui-sans-serif,system-ui,sans-serif;padding:20px;color:#0e1a1f}
  .card{background:#fff;border:1px solid rgba(3,57,67,.1);border-radius:6px;overflow:hidden;max-width:320px;box-shadow:0 1px 2px rgba(3,57,67,.06),0 12px 32px -12px rgba(3,57,67,.18)}
  .img{aspect-ratio:4/3;background:linear-gradient(135deg,#069c3c,#1b6b59);border-radius:0 3rem 0 0;position:relative}
  .tag{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.96);color:#1b6b59;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border-radius:3px}
  .pad{padding:24px}
  h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
  p{margin:8px 0 0 0;color:#6b7a7e;font-size:13px;line-height:1.55}
  a{display:inline-flex;align-items:center;gap:4px;margin-top:14px;color:#069c3c;font-weight:500;font-size:13px;text-decoration:none}
</style></head><body>
<div class="card">
  <div class="img"><span class="tag">Cardiology</span></div>
  <div class="pad">
    <h3>Once-daily anti-hypertensive.</h3>
    <p>Indicated for adults with primary hypertension. 5, 10, 20 mg tablets across 24 markets.</p>
    <a>Learn more →</a>
  </div>
</div>
</body></html>
