<!doctype html><html><head><meta charset="utf-8"/>
<style>
  body{margin:0;background:#f6f7f4;font-family:ui-sans-serif,system-ui,sans-serif;padding:20px}
  .row{display:flex;gap:12px}
  .sw{flex:1;aspect-ratio:1/1;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-weight:700;font-size:13px;line-height:1.2;border:1px solid rgba(3,57,67,.1)}
  .hex{font-weight:500;font-size:11px;font-family:ui-monospace,monospace;opacity:.7;margin-top:4px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#f6f7f4;color:#033943">Paper<div class="hex">#F6F7F4</div></div>
  <div class="sw" style="background:#ecede8;color:#033943">Surface 2<div class="hex">#ECEDE8</div></div>
  <div class="sw" style="background:#6b7a7e;color:#fff">Mute<div class="hex">#6B7A7E</div></div>
  <div class="sw" style="background:#0e1a1f;color:#fff">Ink<div class="hex">#0E1A1F</div></div>
</div>
</body></html>
