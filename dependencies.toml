# Every external dependency of this repo, in one place.
#
# scripts/deps.py reads this file:   python scripts/deps.py list | check | install ID | outdated | set-pin ID VERSION
# docs/DEPENDENCIES.md is generated from it (python scripts/deps.py docs); CI fails if the two drift.
#
# Fields
#   id, name, kind, category, purpose, used_by   what it is and who needs it
#   required    true = bootstrap and core agents fail without it; false = only the listed features need it
#   roles       optional tools only: which machine roles need it (research, video, slides, images, 3d);
#               the bootstrap installs the roles chosen in AUTOMATA_ROLES and the doctor warns only about those
#   pin         the exact version this repo expects (empty = not pinned; min_version for a floor)
#   pin_files   files that must all contain the pin, as {file, pattern} with {version} in the pattern;
#               `deps.py check` verifies they agree, `deps.py set-pin` rewrites all of them at once
#   check       command that proves it is installed (first word is looked up on PATH)
#   version_regex  pulls the version out of the check command's output, to compare with pin / min_version
#   install     per-OS install command ({linux, windows, macos} or all); text starting "manual:" is printed, not run
#   install_note  extra context shown in docs (never part of the command)
#   update      how to move to a newer version
#   on_break    first things to try when it stops working
#   upstream    where `deps.py outdated` looks for the newest version: npm:PKG | pypi:PKG | github-release:OWNER/REPO | github-commit:OWNER/REPO
#
# Kinds: runtime, python-lock, node-lock, mcp-npm, mcp-uvx, mcp-remote, github-release, uv-tool, system, app,
#        browser, external-skills, ci-action

# ---------------------------------------------------------------- runtimes

[[dependency]]
id = "python"
name = "Python"
kind = "runtime"
category = "Runtimes"
purpose = "Runs every agent package, script and test."
used_by = ["everything"]
required = true
min_version = "3.12"
check = ["python3", "--version"]
check_windows = ["python", "--version"]
version_regex = 'Python (\d+\.\d+\.\d+)'
install = { linux = "sudo apt-get install -y python3 python3-venv", windows = "winget install -e --accept-source-agreements --accept-package-agreements --id Python.Python.3.12", macos = "brew install python@3.12" }
update = "Install the newer Python, delete .venv, re-run bootstrap. Keep requires-python in pyproject.toml in step."
on_break = "Recreate the venv: delete .venv and run the bootstrap. On Windows, check the 'python' on PATH is not the Microsoft Store stub."

[[dependency]]
id = "uv"
name = "uv"
kind = "runtime"
category = "Runtimes"
purpose = "Installs the locked Python environment (uv sync) and runs uvx MCP servers and uv tools."
used_by = ["bootstrap", "blender MCP", "gimp MCP", "browser-act"]
required = true
check = ["uv", "--version"]
version_regex = 'uv (\d+\.\d+\.\d+)'
install = { linux = "curl -LsSf https://astral.sh/uv/install.sh | sh", windows = "winget install -e --accept-source-agreements --accept-package-agreements --id astral-sh.uv", macos = "brew install uv" }
update = "uv self update"
on_break = "uv self update; if uv sync fails, run `uv lock --check` to see whether uv.lock is stale."
upstream = "github-release:astral-sh/uv"

[[dependency]]
id = "node"
name = "Node.js"
kind = "runtime"
category = "Runtimes"
purpose = "Runs npm MCP servers through scripts/mcp-npx.mjs, the HTML-to-PPTX tool and the ig-research scraper."
used_by = ["research MCPs", "tools/pdf_utils/html_to_pptx.js", "agents/automata_core/ig-research"]
required = true
min_version = "22.12"
check = ["node", "--version"]
version_regex = 'v(\d+\.\d+\.\d+)'
install_note = "The default `node` on PATH must be 22.12+ (sharp, the slide exporters). Linux with fnm: `fnm install 22 && fnm default 22`, and load fnm in ~/.bashrc: `export PATH=\"$HOME/.local/share/fnm:$PATH\"; eval \"$(fnm env --shell bash)\"`. A distro's nodejs 22 package also works."
install = { linux = "fnm install 22", windows = "winget install -e --accept-source-agreements --accept-package-agreements --id OpenJS.NodeJS.LTS", macos = "brew install node@22" }
update = "Install a newer LTS (fnm install 24 / winget upgrade OpenJS.NodeJS.LTS). mcp-npx.mjs picks the newest compatible one automatically."
on_break = "`node --version` must print v22.12 or newer; if it shows an older system Node, load fnm in your shell (see install note). `node scripts/mcp-npx.mjs --which` shows which Node the MCP servers will use. 'none' = install Node 22+. An older default Node is fine as long as a newer one exists (fnm, nvm, PATH)."

[[dependency]]
id = "git"
name = "Git"
kind = "runtime"
category = "Runtimes"
purpose = "Repo sync between the two machines; the cross-platform checker lists files with it."
used_by = ["everything"]
required = true
check = ["git", "--version"]
version_regex = 'git version (\d+\.\d+\.\d+)'
install = { linux = "sudo apt-get install -y git", windows = "winget install -e --accept-source-agreements --accept-package-agreements --id Git.Git", macos = "xcode-select --install" }
update = "Package manager upgrade."
on_break = "Line-ending trouble: .gitattributes pins *.sh/*.py to LF and *.cmd to CRLF; run `git add --renormalize .` once if a script shows CRLF."

[[dependency]]
id = "gh"
name = "GitHub CLI (gh)"
kind = "runtime"
category = "Runtimes"
purpose = "Browser login to GitHub for cloning and pushing the private repo; lets agents read CI results."
used_by = ["README fresh-machine setup", "git push (gh auth setup-git)", "CI checks"]
required = false
check = ["gh", "--version"]
version_regex = 'gh version (\d+\.\d+\.\d+)'
install = { linux = "sudo apt-get install -y gh", windows = "winget install -e --accept-source-agreements --accept-package-agreements --id GitHub.cli", macos = "brew install gh" }
update = "Package manager upgrade."
on_break = "`gh auth status`; if logged out: `gh auth login --web --git-protocol https`, then `gh auth setup-git`. Pushing workflow files needs the workflow scope: `gh auth refresh -s workflow`."

# ---------------------------------------------------------------- python and node libraries

[[dependency]]
id = "python-packages"
name = "Python packages (root project)"
kind = "python-lock"
category = "Libraries"
purpose = "All Python libraries for the four agency packages and the root tooling, locked exactly in uv.lock."
used_by = ["packages/*", "scripts/*", "tests"]
required = true
pin_files = [{ file = "uv.lock" }]
check = ["uv", "lock", "--check"]
install = { all = "uv sync --locked" }
update = "One package: `uv lock --upgrade-package NAME` then `uv sync`. Everything: `uv lock --upgrade`. Run tests, commit uv.lock. Ranges live in pyproject.toml files; requirements.txt mirrors the root pyproject for CI and must be edited with it."
on_break = "`uv sync --locked` reinstalls exactly what uv.lock says. If a just-upgraded package broke something, `git checkout HEAD~1 -- uv.lock && uv sync --locked` rolls it back."

[[dependency]]
id = "node-packages"
name = "Node packages (root)"
kind = "node-lock"
category = "Libraries"
purpose = "playwright (HTML-to-PPTX screenshots), pptxgenjs, animate.css."
used_by = ["tools/pdf_utils/html_to_pptx.js", "slides"]
required = false
pin_files = [{ file = "package-lock.json" }]
install = { all = "npm ci" }
update = "npm install PKG@VERSION (updates package-lock.json), run the tool once, commit both files. After a playwright bump also run `npx playwright install chromium`."
on_break = "npm ci restores node_modules exactly from package-lock.json."

[[dependency]]
id = "ig-research-packages"
name = "Node packages (ig-research scraper)"
kind = "node-lock"
category = "Libraries"
purpose = "puppeteer-core for the CDP Instagram scraper."
used_by = ["agency-research --scraper cdp"]
required = false
pin_files = [{ file = "agents/automata_core/ig-research/package-lock.json" }]
install = { all = "npm ci --prefix agents/automata_core/ig-research" }
update = "npm install puppeteer-core@VERSION --prefix agents/automata_core/ig-research"
on_break = "npm ci --prefix agents/automata_core/ig-research"

[[dependency]]
id = "playwright-browsers"
name = "Playwright Chromium builds"
kind = "browser"
category = "Libraries"
purpose = "Headless Chromium for the Node playwright (1.61) and the Python playwright (1.59); each version needs its own browser build."
used_by = ["html_to_pptx.js", "agency-research --scraper playwright", "html-preview skill"]
required = false
install = { all = "npx playwright install chromium && .venv python -m playwright install chromium" }
update = "Runs automatically in bootstrap; re-run after bumping either playwright package."
on_break = "'Executable doesn't exist at ...ms-playwright...' means the browser for that playwright version is missing: re-run the bootstrap (or the two install commands)."

