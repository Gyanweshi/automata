[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-research"
version = "0.1.0"
description = "Research agent — social media scraping and competitive analysis"
requires-python = ">=3.11"
dependencies = [
    "agency-common",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "scrapling[ai]>=0.4.9,<0.5",
    "tenacity>=8.2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]

[project.scripts]
agency-research = "agency_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
