[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-storyboard"
version = "0.1.0"
description = "Storyboard agent — AI prompt writing and visual scene planning for brand content"
requires-python = ">=3.11"
dependencies = [
    "agency-common",
    "jinja2>=3.1",
]

[project.scripts]
agency-storyboard = "agency_storyboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
