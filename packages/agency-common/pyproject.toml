[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-common"
version = "0.1.0"
description = "Shared models, config, and utilities for agency agents"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "tenacity>=8.2.0",
    "openai>=1.0,<2.0",
    "openai>=1.0,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0"
]
vector = [
    "chromadb>=0.5.0,<2.0",
]

[project.scripts]
agency-session-watchdog = "agency_common.obsidian_vector_index:run_session_watchdog"
agency-autonomous = "agency_common.autonomous_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
