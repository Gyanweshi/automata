[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-common"
version = "0.1.0"
description = "Shared models, config, and utilities for agency agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["src"]
